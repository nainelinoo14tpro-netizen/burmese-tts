<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burmese Text-to-Speech</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #1a73e8;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea,
    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
    }

    textarea {
      min-height: 140px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
    }

    select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    button {
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    audio {
      width: 100%;
      margin-top: 24px;
    }

    #status {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>🇲🇲 မြန်မာစာ အသံပြောင်းစနစ်</h1>

    <label for="text">မြန်မာစာသား ထည့်သွင်းပါ</label>
    <textarea id="text">မင်္ဂလာပါ။ မြန်မာစာကို အသံအဖြစ် ပြောင်းလဲနိုင်ပါသည်။</textarea>

    <label for="voice">Voice</label>
    <select id="voice">
      <option value="my-MM-NilarNeural" selected>နီလာ (Nilar - Female)</option>
      <option value="my-MM-ThihaNeural">သီဟ (Thiha - Male)</option>
    </select>

    <label for="rate">အမြန်နှုန်း (Rate)</label>
    <select id="rate">
      <option value="-20%">Slow (-20%)</option>
      <option value="+0%" selected>Normal (0%)</option>
      <option value="+20%">Fast (+20%)</option>
    </select>

    <button id="synthesizeButton">အသံဖန်တီးရန်</button>

    <p id="status"></p>
    <audio id="audio" controls></audio>
  </main>

  <script>
    const textInput = document.querySelector("#text");
    const voiceInput = document.querySelector("#voice");
    const rateInput = document.querySelector("#rate");
    const button = document.querySelector("#synthesizeButton");
    const status = document.querySelector("#status");
    const audio = document.querySelector("#audio");

    button.addEventListener("click", async () => {
      const text = textInput.value.trim();
      if (!text) {
        status.textContent = "❌ ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ။";
        status.style.color = "red";
        return;
      }

      button.disabled = true;
      status.textContent = "အသံဖန်တီးနေပါသည်... ခေတ္တစောင့်ပါ။";
      status.style.color = "#2563eb";
      audio.removeAttribute("src");
      audio.load();

      try {
        const response = await fetch("/api/synthesize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            text: text,
            voice: voiceInput.value,
            rate: rateInput.value,
            pitch: "+0Hz",
          }),
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.details || errData.error || "Request failed");
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        audio.src = audioUrl;
        audio.load();
        audio.play();
        status.textContent = "✅ အသံဖိုင် အဆင်သင့်ဖြစ်ပါပြီ။";
        status.style.color = "green";
      } catch (error) {
        status.textContent = `❌ အမှား: ${error.message}`;
        status.style.color = "red";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
